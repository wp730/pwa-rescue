<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Endereços disponíveis</title>
  <style>
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #0D0E27; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 32px 20px; box-sizing: border-box;
      text-align: center;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    .sub { font-size: 14px; opacity: 0.65; margin: 0 0 24px; max-width: 320px; line-height: 1.5; }
    .list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .item {
      display: block;
      padding: 16px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      word-break: break-all;
      transition: background 0.15s, transform 0.1s;
      position: relative;
    }
    .item:active { transform: scale(0.98); background: rgba(255,255,255,0.14); }
    .item .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
      background: rgba(108, 207, 255, 0.18);
      color: #6cf;
    }
    .item.ok .badge { background: rgba(80, 220, 130, 0.18); color: #5d8; }
    .footer { margin-top: 28px; font-size: 12px; opacity: 0.5; }
    .footer a { color: #6cf; text-decoration: none; }
    .hide { display: none; }
    .fail h1 { color: #f99; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="loading">
    <div class="spinner"></div>
    <h1>Carregando endereços...</h1>
    <p class="sub">Aguarde alguns instantes</p>
  </div>

  <div id="content" class="hide">
    <h1>Endereços disponíveis</h1>
    <p class="sub">Toque em um endereço para abrir no navegador</p>
    <div id="list" class="list"></div>
    <div class="footer">
      Suporte ao cliente: <a id="latestLink" href="#" target="_blank" rel="noopener noreferrer">contato</a>
    </div>
  </div>

  <div id="fail" class="hide fail">
    <h1>Não foi possível carregar</h1>
    <p class="sub">Verifique sua conexão e tente novamente.</p>
    <div class="footer">
      <a id="failLink" href="#" target="_blank" rel="noopener noreferrer">Falar com suporte</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ========== 配置区 ==========

  var DOMAIN_API_ENDPOINTS = [
    'https://YOUR-API-1.example.com/api/index/pwa-domains',
    // 'https://YOUR-WORKER.workers.dev/api/index/pwa-domains',
  ];

  var FALLBACK_DOMAINS = [
    'https://ca999.game',
    'https://mx39.com',
    'https://p933.com'
  ];

  // 兜底客服链接(接口失败或未返回 support_url 时使用)
  var DEFAULT_SUPPORT_URL = 'https://t.me/your_channel';
  var FETCH_TIMEOUT = 4000;

  var supportUrl = DEFAULT_SUPPORT_URL;

  // ============================

  var ctx = (function () {
    var p = new URLSearchParams(location.search);
    return {
      from: p.get('from') || '',
      path: p.get('path') || (location.search + location.hash),
      t:    p.get('t')    || ''
    };
  })();

  var tail = ctx.path || (location.search + location.hash);
  if (tail && tail[0] !== '/' && tail[0] !== '?' && tail[0] !== '#') tail = '/' + tail;

  function $(id) { return document.getElementById(id); }

  function showFail() {
    $('loading').classList.add('hide');
    $('content').classList.add('hide');
    $('fail').classList.remove('hide');
    $('failLink').href = supportUrl;
  }

  function renderList(domains) {
    var list = $('list');
    list.innerHTML = '';

    domains.forEach(function (base, idx) {
      var clean = base.replace(/\/+$/, '');
      var target = clean + tail;

      var a = document.createElement('a');
      a.className = 'item';
      a.href = target;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = clean.replace(/^https?:\/\//, '');

      if (idx === 0) {
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'Recomendado';
        a.appendChild(badge);
      }

      list.appendChild(a);
    });

    $('loading').classList.add('hide');
    $('content').classList.remove('hide');
    $('latestLink').href = supportUrl;
  }

  function fetchDomainList() {
    if (!ctx.from || !DOMAIN_API_ENDPOINTS.length) return Promise.resolve(null);

    var promises = DOMAIN_API_ENDPOINTS.map(function (base) {
      return new Promise(function (resolve, reject) {
        var ctrl = ('AbortController' in window) ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
          reject(new Error('timeout'));
        }, FETCH_TIMEOUT);

        var url = base
          + (base.indexOf('?') === -1 ? '?' : '&')
          + 'from=' + encodeURIComponent(ctx.from)
          + '&_=' + Date.now();

        fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
          .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
          .then(function (data) {
            clearTimeout(timer);
            if (data && Array.isArray(data.domains) && data.domains.length) {
              if (data.support_url && typeof data.support_url === 'string') {
                supportUrl = data.support_url;
              }
              resolve(data.domains);
            } else {
              reject(new Error('invalid data'));
            }
          })
          ['catch'](function (err) {
            clearTimeout(timer);
            reject(err);
          });
      });
    });

    return new Promise(function (resolve) {
      var failed = 0;
      promises.forEach(function (p) {
        p.then(resolve)['catch'](function () {
          failed++;
          if (failed === promises.length) resolve(null);
        });
      });
    });
  }

  (function main() {
    fetchDomainList().then(function (dynamicList) {
      var pool = (dynamicList && dynamicList.length) ? dynamicList : FALLBACK_DOMAINS;
      if (!pool || !pool.length) {
        showFail();
        return;
      }
      renderList(pool);
    })['catch'](showFail);
  })();
})();
</script>
</body>
</html>
